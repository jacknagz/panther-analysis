AnalysisType: rule
Filename: okta_potentially_stolen_session_custom.py
RuleID: Okta.PotentiallyStolenSession.Custom
DisplayName: Okta Potentially Stolen Session
Enabled: true
LogTypes:
  - Okta.SystemLog
Tags:
  - custom
  - compliance.soc2
  - mitre.ta0006.credential_access
  - mitre.t1539.steal_web_session_cookie
  - usecase.authentication_monitoring
  - asset.identity_management
  - threat.external
  - impact.confidentiality
  - risk.high
Reports:
  MITRE ATT&CK:
    - TA0006:T1539
Severity: High
Description: This rule looks for the same session being used from two devices, indicating a compromised session token.
Runbook: |
  1. Compare the current session details (client.ipAddress, client.userAgent) with the previous session context to confirm device and network differences
  2. Query Okta SystemLog for all events using this externalSessionId in the 24 hours surrounding this alert to build a full session timeline
  3. If confirmed as stolen, immediately revoke the user's active sessions and reset their credentials, then search for downstream application access via SSO
Reference: https://sec.okta.com/sessioncookietheft
SummaryAttributes:
  - eventType
  - severity
  - p_any_ip_addresses
  - p_any_domain_names
Tests:
  - Name: Same device and OS
    ExpectedResult: false
    Mocks:
      - objectName: get_string_set
        returnValue: >
          [
              "263297",
              "1.2.3.4",
              "user_agent:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/84.0.4147.135 Safari/537.36",
              "CHROME",
              "Linux"
          ]
    Log:
      {
        "actor":
          {
            "alternateId": "admin",
            "displayName": "unknown",
            "id": "unknown",
