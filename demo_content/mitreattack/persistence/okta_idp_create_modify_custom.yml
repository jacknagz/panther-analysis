AnalysisType: rule
Filename: okta_idp_create_modify_custom.py
RuleID: "Okta.Identity.Provider.Created.Modified.Custom"
DisplayName: "Okta Identity Provider Created or Modified"
Enabled: true
LogTypes:
  - Okta.SystemLog
Reports:
  MITRE ATT&CK:
    - TA0006:T1556 # Modify Authentication Process
    - TA0001:T1199 # Trusted Relationship
    - TA0003:T1098 # Account Manipulation
Tags:
  - custom
  - compliance.soc2
  - mitre.ta0003.persistence
  - mitre.t1098.account_manipulation
  - mitre.ta0006.credential_access
  - mitre.t1556.modify_authentication_process
  - mitre.ta0001.initial_access
  - mitre.t1199.trusted_relationship
  - usecase.configuration_management
  - asset.identity_management
  - threat.external
  - impact.confidentiality
  - impact.integrity
  - risk.high
Severity: High
Description: >
  A new 3rd party Identity Provider has been created or modified.
  Attackers have been observed configuring a second Identity Provider to act as an "impersonation app"
  to access applications within the compromised Org on behalf of other users. This second Identity Provider,
  also controlled by the attacker, would act as a "source" IdP in an inbound federation relationship
  (sometimes called "Org2Org") with the target.
Runbook: |
  1. Verify the Identity Provider change in the target field was authorized via change management and confirm with the actor (actor.alternateId)
  2. Query Okta SystemLog for all system.idp.lifecycle events in the past 7 days to identify related IdP configuration changes
  3. Monitor for any user.authentication.auth_via_IDP events using this Identity Provider in the 48 hours following the change
Reference: >
  https://sec.okta.com/articles/2023/08/cross-tenant-impersonation-prevention-and-detection
DedupPeriodMinutes: 30
Threshold: 1
