AnalysisType: rule
Filename: okta_admin_role_assigned_custom.py
RuleID: "Okta.AdminRoleAssigned.Custom"
DisplayName: "Okta Admin Role Assigned"
Enabled: true
LogTypes:
  - Okta.SystemLog
Tags:
  - custom
  - compliance.soc2
  - mitre.ta0004.privilege_escalation
  - mitre.t1078.valid_accounts
  - usecase.privileged_access_monitoring
  - asset.identity_management
  - threat.insider
  - impact.integrity
  - risk.medium
Reports:
  MITRE ATT&CK:
    - TA0004:T1078
Severity: Info
Description: A user has been granted administrative privileges in Okta
Reference: https://help.okta.com/en/prod/Content/Topics/Security/administrators-admin-comparison.htm
Runbook: |
  1. Confirm the privilege grant (debugContext.debugData.privilegeGranted) to the target user was authorized and review the associated change request
  2. Query Okta SystemLog for all user.account.privilege.grant events by the actor (actor.alternateId) in the past 30 days to identify patterns of privilege assignments
  3. Review the target user's subsequent admin console activity in the 24 hours following the privilege grant
DedupPeriodMinutes: 15
SummaryAttributes:
  - eventType
  - severity
  - displayMessage
  - p_any_ip_addresses
